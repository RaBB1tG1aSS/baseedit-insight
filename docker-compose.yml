services:
  web:
    build: .
    image: baseedit-insight:local
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: baseedit-insight:local
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
    command: ["npm", "run", "worker"]
    volumes:
      - ./data:/app/data
    depends_on:
      web:
        condition: service_started
